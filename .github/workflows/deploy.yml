name: Build and deploy

# The documentation is not authored in this repository — it is pulled from
# owenbush/upkeep at build time, so a page and the code it describes are
# reviewed in the same pull request over there. That means this site has to
# rebuild when *that* repository changes, not only when this one does:
#
#   - push here          — a change to the landing page, the theme or the sync
#   - schedule           — picks up merged docs changes without any secret
#   - workflow_dispatch  — "Run workflow" to publish a docs change immediately
#
# To make an upkeep docs change deploy the moment it merges, add a workflow
# there that sends a repository_dispatch to this repo with a PAT. Deliberately
# not the default: it costs a stored credential, and a day is not a long time
# for a documentation page.
#
# A missing DOCS_READ_TOKEN fails the build rather than deploying the site
# without its documentation. Every sidebar entry would 404, which is worse
# than the previous deploy staying up: a stale site is coherent, a hollow one
# is not.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # The job's own GITHUB_TOKEN is scoped to this repository, and upkeep is
      # private while it is unreleased — so a checkout of it with the default
      # token gets a 404 from the API and retries into a failure whose message
      # ("Not Found") says nothing about the cause. Checked first so the
      # failure names the secret instead.
      # Read through `env` rather than tested in an `if:` — the secrets context
      # is not available to a step-level condition, so an `if` on it does not
      # do what it reads as.
      - name: Require the documentation read token
        env:
          DOCS_READ_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
        run: |
          if [ -z "${DOCS_READ_TOKEN}" ]; then
            echo '::error::DOCS_READ_TOKEN is not set, so owenbush/upkeep cannot be checked out.'
            echo 'The documentation is pulled from that repository at build time, and it is private.'
            echo 'Add a repository secret DOCS_READ_TOKEN holding a token with read access to it.'
            exit 1
          fi

      - name: Check out upkeep (the documentation source of truth)
        uses: actions/checkout@v4
        with:
          repository: owenbush/upkeep
          path: .upkeep
          token: ${{ secrets.DOCS_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on a documentation link that points outside the synced
      # set, rather than publishing a page with a dead link in it.
      - name: Sync the documentation
        run: node scripts/sync-docs.mjs .upkeep

      - run: npm run build:nosync

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
